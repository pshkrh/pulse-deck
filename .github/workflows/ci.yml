name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: com.pshkrh.pulse-deck.sdPlugin/package-lock.json

      - name: Install Plugin Dependencies
        run: npm run prepare

      - name: Run Tests
        run: npm test
